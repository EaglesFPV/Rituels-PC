name: Android émulateur

# Lance l'application sur un émulateur Android, vérifie qu'elle démarre sans planter et capture l'écran.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Démarrage sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Compiler l'APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Autoriser KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'application sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p shots
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n fr.rituelspc.app/.MainActivity
            sleep 6
            adb exec-out screencap -p > shots/1-demarrage.png
            adb logcat -d > shots/logcat.txt
            if grep -E "FATAL EXCEPTION|AndroidRuntime: Process" shots/logcat.txt; then echo "L'application a planté"; exit 1; fi
            adb shell pidof fr.rituelspc.app

      - name: Joindre les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-emulateur
          path: shots
          if-no-files-found: warn
