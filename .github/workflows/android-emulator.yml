name: Android émulateur

# Scénario de bout en bout sur émulateur : association, lancement d'un mode, PC éteint, allumage, mode lancé au réveil.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Scénario sur émulateur
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      # Compile la version réduite (R8) et signée : celle qui est réellement distribuée, pour que
      # ce scénario prouve que la réduction du code ne casse rien (scan QR code, WebView, réseau).
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rituels-pc.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rituels-pc.p12" >> "$GITHUB_ENV"
          fi

      - name: Compiler l'APK réduit et signé
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon

      - name: Autoriser KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'application sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash .github/scripts/android-e2e.sh

      - name: Joindre les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Android-emulateur
          path: shots
          if-no-files-found: warn
