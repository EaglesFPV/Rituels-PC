name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. 1.1.0)'
        required: true
        type: string
      notes:
        description: 'Nouveautés (facultatif, une ligne)'
        required: false
        type: string
      draft:
        description: 'Créer en brouillon (à relire et publier depuis Releases)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publier Rituels PC v${{ inputs.version }}
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Vérifier le numéro de version
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') {
            throw "« $env:VERSION » n'est pas un numéro de version valide (format attendu : 1.2.3)."
          }
          $latest = git tag --list 'v*' --sort=-v:refname | Select-Object -First 1
          if ($latest -and [version]$env:VERSION -le [version]$latest.TrimStart('v')) {
            throw "La version $env:VERSION doit être supérieure à la dernière publiée ($latest)."
          }
          "Dernière version : $(if ($latest) { $latest } else { 'aucune' }) → nouvelle version : v$env:VERSION"

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer la version
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Tests
        run: npm test

      - name: Compiler l'installateur
        run: npx electron-builder --win --publish never

      - name: Calculer les empreintes SHA-256
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Enregistrer la version et créer le tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) { git commit -m "Version $env:VERSION" }
          git tag -a "v$env:VERSION" -m "Rituels PC $env:VERSION"
          git push origin HEAD:main "v$env:VERSION"

      - name: Publier dans Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $intro = if ($env:NOTES) { "$env:NOTES`n`n" } else { '' }
          $body = @"
          $intro## Installation

          Téléchargez **Rituels-PC-Setup-$env:VERSION.exe** ci-dessous et lancez-le. Les versions déjà installées
          se mettent à jour automatiquement.

          L'installateur n'est pas signé numériquement : Windows SmartScreen peut afficher
          « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires › Exécuter quand même**.

          Empreinte SHA-256 : voir ``SHA256SUMS.txt``.

          **Application Android** : téléchargez **Rituels-PC-Android-$env:VERSION.apk** sur le téléphone et autorisez
          l'installation depuis le navigateur ou le gestionnaire de fichiers (application hors Google Play).
          Empreinte : voir ``SHA256SUMS-android.txt``.
          "@
          $arguments = @(
            "v$env:VERSION",
            "dist\Rituels-PC-Setup-$env:VERSION.exe",
            "dist\Rituels-PC-Setup-$env:VERSION.exe.blockmap",
            "dist\latest.yml",
            "dist\SHA256SUMS.txt",
            "--title", "Rituels PC v$env:VERSION",
            "--notes", $body,
            "--generate-notes",
            "--latest"
          )
          if ($env:DRAFT -eq 'true') { $arguments += '--draft' }
          gh release create @arguments

  android:
    name: Application Android v${{ inputs.version }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Récupérer le code de la version
        uses: actions/checkout@v7
        with:
          ref: v${{ inputs.version }}

      - name: Installer Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2

      - name: Préparer la clé de signature
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Les secrets de signature Android sont absents."; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rituels-pc.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/rituels-pc.p12" >> "$GITHUB_ENV"

      - name: Tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Compiler l'APK signé
        working-directory: android
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          gradle assembleRelease --no-daemon -PversionName="$VERSION" -PversionCode=$((major * 10000 + minor * 100 + patch))

      - name: Vérifier la signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publier l'APK dans la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Rituels-PC-Android-$VERSION.apk"
          sha256sum "Rituels-PC-Android-$VERSION.apk" > SHA256SUMS-android.txt
          cat SHA256SUMS-android.txt
          gh release upload "v$VERSION" "Rituels-PC-Android-$VERSION.apk" SHA256SUMS-android.txt --clobber
